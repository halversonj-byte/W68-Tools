<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner - W68 Teacher Tools</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --tool-color: #9b1028; }
        .spinner-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
            max-width: 90vw;
        }
        .spinner-wrapper canvas {
            width: 100%;
            height: 100%;
        }
        .spinner-pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 30px solid var(--primary);
            z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .result-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--tool-color);
            min-height: 2.5rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header class="tool-header">
        <a href="../index.html" class="back-link" aria-label="Back to tools">&#8592;</a>
        <h1>Spinner</h1>
    </header>

    <div class="tool-container">
        <div class="display-box">
            <div class="spinner-wrapper">
                <div class="spinner-pointer"></div>
                <canvas id="spinnerCanvas" width="400" height="400"></canvas>
            </div>
            <div class="result-text" id="result"></div>
        </div>

        <div class="btn-group" style="margin-bottom:1.5rem;">
            <button class="btn btn-primary btn-large" id="spinBtn" onclick="spin()">&#10047; Spin!</button>
        </div>

        <div class="settings-panel">
            <div class="input-group">
                <label for="optionsInput">Options (one per line)</label>
                <textarea id="optionsInput" rows="6" oninput="drawWheel()">Option 1
Option 2
Option 3
Option 4</textarea>
            </div>
            <div style="margin-top:0.5rem;">
                <label style="font-weight:600; font-size:0.95rem;">Presets:</label>
                <div class="btn-group" style="margin-top:0.5rem;">
                    <button class="btn btn-secondary" onclick="setPreset('yes-no')">Yes / No</button>
                    <button class="btn btn-secondary" onclick="setPreset('numbers')">1 - 6</button>
                    <button class="btn btn-secondary" onclick="setPreset('colors')">Colors</button>
                    <button class="btn btn-secondary" onclick="setPreset('roles')">Team Roles</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/sounds.js"></script>
    <script>
        const colors = [
            '#e74c3c', '#3498db', '#2ecc71', '#e67e22', '#9b59b6',
            '#1abc9c', '#34495e', '#e91e63', '#00bcd4', '#ff9800',
            '#795548', '#607d8b'
        ];

        let rotation = 0;
        let spinning = false;

        function getOptions() {
            return document.getElementById('optionsInput').value
                .split('\n').map(s => s.trim()).filter(s => s.length > 0);
        }

        function drawWheel(extraRotation = 0) {
            const canvas = document.getElementById('spinnerCanvas');
            const ctx = canvas.getContext('2d');
            const options = getOptions();
            if (options.length === 0) return;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 10;
            const sliceAngle = (2 * Math.PI) / options.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(extraRotation);

            options.forEach((opt, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Draw slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, r, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = `bold ${Math.min(18, 200 / options.length)}px sans-serif`;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 3;
                ctx.fillText(opt, r - 20, 5);
                ctx.shadowBlur = 0;
                ctx.restore();
            });

            // Center circle
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function spin() {
            if (spinning) return;
            const options = getOptions();
            if (options.length < 2) { alert('Enter at least 2 options.'); return; }

            spinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').textContent = '';

            const totalRotation = (Math.random() * 360 + 1440); // At least 4 full spins
            const duration = 3000;
            const startTime = Date.now();
            const startRotation = rotation;

            playWhoosh();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic
                const eased = 1 - Math.pow(1 - progress, 3);
                const currentDeg = startRotation + totalRotation * eased;
                const rad = (currentDeg * Math.PI) / 180;
                drawWheel(rad);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    rotation = currentDeg % 360;
                    spinning = false;
                    document.getElementById('spinBtn').disabled = false;

                    // Determine winner - pointer is at top (270deg in standard coords)
                    const sliceAngle = 360 / options.length;
                    const normalizedAngle = (360 - (rotation % 360)) % 360;
                    const winnerIndex = Math.floor(normalizedAngle / sliceAngle) % options.length;
                    document.getElementById('result').textContent = options[winnerIndex];
                    playChime();
                }
            }

            requestAnimationFrame(animate);
        }

        function setPreset(name) {
            const presets = {
                'yes-no': 'Yes\nNo',
                'numbers': '1\n2\n3\n4\n5\n6',
                'colors': 'Red\nBlue\nGreen\nYellow\nOrange\nPurple',
                'roles': 'Reader\nRecorder\nReporter\nTime Keeper'
            };
            document.getElementById('optionsInput').value = presets[name] || '';
            drawWheel();
        }

        // Initial draw
        drawWheel();

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') { e.preventDefault(); spin(); }
        });
    </script>
</body>
</html>
