<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner - W68 Teacher Tools</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --tool-color: #9b1028; }

        html, body { height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tool-header { flex: none; }

        /* App: stage on the left, settings panel on the right */
        .app {
            flex: 1;
            min-height: 0;
            display: flex;
        }
        .stage {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.25rem;
            gap: 0.75rem;
        }

        /* Toolbar */
        .toolbar {
            flex: none;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .wheel-count {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .storage-warning {
            display: none;
            flex: none;
            background: #fff4e5;
            border-left: 4px solid #ff9800;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .storage-warning.active { display: block; }

        /* Wheel row: every wheel on one line, sized by JS to fit without scrolling */
        .wheel-row {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--row-gap, 12px);
            --wheel-size: 300px;
        }
        .wheel-card {
            flex: none;
            width: calc(var(--wheel-size) + 16px);
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            border-top: 4px solid var(--tool-color);
            transition: box-shadow 0.15s;
        }
        .wheel-card.active { border-top-color: var(--accent-light); }
        .wheel-card.selected { box-shadow: 0 0 0 3px var(--accent-light), var(--shadow); }

        .wheel-head {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 26px;
        }
        .wheel-title {
            flex: 1;
            min-width: 0;
            font-weight: 700;
            font-size: clamp(0.7rem, calc(var(--wheel-size) * 0.085), 1.05rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
        }
        .wheel-title:hover { background: #f0f2f5; }
        .select-toggle {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            cursor: pointer;
        }
        .select-toggle input {
            width: clamp(14px, calc(var(--wheel-size) * 0.11), 20px);
            height: clamp(14px, calc(var(--wheel-size) * 0.11), 20px);
            accent-color: var(--accent-light);
            cursor: pointer;
            margin: 0;
        }
        .icon-btn {
            border: none;
            background: #ecf0f1;
            color: var(--text);
            width: clamp(22px, calc(var(--wheel-size) * 0.16), 32px);
            height: clamp(22px, calc(var(--wheel-size) * 0.16), 32px);
            border-radius: 6px;
            cursor: pointer;
            font-size: clamp(0.75rem, calc(var(--wheel-size) * 0.08), 1.05rem);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: #dfe6e9; }
        .wheel-card.active .icon-btn.edit { background: var(--accent-light); color: white; }

        .spinner-wrapper {
            position: relative;
            width: var(--wheel-size);
            height: var(--wheel-size);
            margin-top: calc(var(--wheel-size) * 0.06);
        }
        .spinner-wrapper canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .spinner-pointer {
            position: absolute;
            top: calc(var(--wheel-size) * -0.035);
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: calc(var(--wheel-size) * 0.035) solid transparent;
            border-right: calc(var(--wheel-size) * 0.035) solid transparent;
            border-top: calc(var(--wheel-size) * 0.07) solid var(--primary);
            z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }
        .wheel-result {
            width: 100%;
            min-height: 1.6em;
            font-size: clamp(0.75rem, calc(var(--wheel-size) * 0.09), 1.4rem);
            font-weight: 700;
            color: var(--tool-color);
            text-align: center;
            line-height: 1.25;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            overflow: hidden;
        }
        .wheel-result span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .wheel-result img {
            width: 1.6em;
            height: 1.6em;
            object-fit: cover;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .wheel-empty {
            font-size: 0.8em;
            color: var(--text-light);
            font-weight: 400;
            white-space: normal;
        }
        .spin-btn {
            padding: 0.35em 1em;
            font-size: clamp(0.7rem, calc(var(--wheel-size) * 0.08), 1rem);
            border-radius: 8px;
        }

        /* Settings panel */
        .panel {
            flex: none;
            width: 360px;
            background: var(--card-bg);
            border-left: 1px solid #dfe6e9;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .panel.collapsed { display: none; }
        .panel-header {
            flex: none;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #eef1f4;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-header h2 { font-size: 1.05rem; }
        .tabs {
            flex: none;
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #eef1f4;
        }
        .tab {
            border: none;
            background: #ecf0f1;
            color: var(--text);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab:hover { background: #dfe6e9; }
        .tab.active { background: var(--tool-color); color: white; }
        .tab-add {
            background: transparent;
            border: 2px dashed #cfd6db;
            color: var(--text-light);
        }
        .tab-add:hover { border-color: var(--tool-color); color: var(--tool-color); background: transparent; }
        .panel-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 1rem;
        }
        .panel-body .input-group { margin-bottom: 1rem; }
        .panel-body textarea { resize: vertical; }
        .editor-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }
        .editor-row select {
            flex: 1;
            min-width: 130px;
            padding: 0.55rem 0.75rem;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }
        .weight-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
        }
        .weight-toggle input { width: 18px; height: 18px; accent-color: var(--tool-color); }
        .option-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .option-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
        .option-row .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
        .option-row .olabel {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pic-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 2px dashed #cfd6db;
            background: #fff;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .pic-btn:hover { border-color: var(--tool-color); }
        .pic-btn.has-pic { border-style: solid; }
        .pic-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pic-clear {
            border: none;
            background: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1rem;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .pic-clear:hover { background: #ecf0f1; color: var(--accent); }
        .option-row .weight-input {
            width: 62px;
            padding: 0.3rem 0.4rem;
            border: 2px solid #dfe6e9;
            border-radius: 6px;
            font: inherit;
            text-align: center;
        }
        .option-row .weight-input:focus { outline: none; border-color: var(--tool-color); }
        .option-row .pct {
            width: 46px;
            text-align: right;
            color: var(--text-light);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }
        .hint {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 0.75rem;
        }
        .panel-footer {
            flex: none;
            padding: 0.75rem 1rem;
            border-top: 1px solid #eef1f4;
            display: flex;
            gap: 0.5rem;
            justify-content: space-between;
            align-items: center;
        }
        .panel.spinning-wheel .panel-body { opacity: 0.5; pointer-events: none; }

        /* Winner popup */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 32, 68, 0.78);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-backdrop.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 760px;
            max-height: 90vh;
            overflow: auto;
            box-shadow: var(--shadow-hover);
            animation: fadeIn 0.3s ease-out;
        }
        .modal-header {
            background: var(--tool-color);
            color: white;
            padding: 1.25rem 1.5rem;
            text-align: center;
            position: sticky;
            top: 0;
        }
        .modal-header h2 { font-size: 1.75rem; }
        .result-list {
            list-style: none;
            padding: 1.25rem 1.5rem;
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        .result-list[data-count="1"] { grid-template-columns: 1fr; }
        .result-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: #f7f8fa;
            border-left: 8px solid var(--c, var(--accent));
        }
        .result-item .r-pic { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .result-item .r-body { flex: 1; min-width: 0; }
        .result-item .r-wheel {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .result-item .r-winner {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            word-break: break-word;
            line-height: 1.2;
        }
        .result-list[data-count="1"] .result-item { flex-direction: column; text-align: center; padding: 1.5rem; }
        .result-list[data-count="1"] .result-item .r-pic { width: 200px; height: 200px; }
        .result-list[data-count="1"] .result-item .r-winner { font-size: 2.75rem; }
        .btn-small { padding: 0.4rem 0.75rem; font-size: 0.8rem; border-radius: 6px; flex-shrink: 0; }
        .modal-footer {
            padding: 0 1.5rem 1.25rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Laptops: a narrower panel leaves more room for a full row of wheels */
        @media (max-width: 1400px) {
            .panel { width: 300px; }
        }

        /* Small screens: stack the panel under the wheels and let the row wrap */
        @media (max-width: 800px) {
            body { overflow: auto; height: auto; }
            .app { flex-direction: column; }
            .stage { padding: 0.75rem; }
            .wheel-row { flex-wrap: wrap; align-items: flex-start; }
            .panel { width: 100%; border-left: none; border-top: 1px solid #dfe6e9; }
            .panel-body { max-height: none; }
            .modal-header h2 { font-size: 1.35rem; }
            .result-list[data-count="1"] .result-item .r-winner { font-size: 2rem; }
            .result-list[data-count="1"] .result-item .r-pic { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>
    <header class="tool-header">
        <a href="../index.html" class="back-link" aria-label="Back to tools">&#8592;</a>
        <h1>Spinner</h1>
    </header>

    <div class="app">
        <main class="stage">
            <div class="toolbar">
                <button class="btn btn-primary btn-large" id="spinAllBtn" onclick="spinAll()">&#10047; Spin All</button>
                <button class="btn btn-primary" id="spinSelectedBtn" onclick="spinSelected()">&#10047; Spin Selected</button>
                <button class="btn btn-secondary" id="addWheelBtn" onclick="addWheel()">+ Add Wheel</button>
                <span class="wheel-count" id="wheelCount"></span>
                <button class="btn btn-secondary" id="panelToggleBtn" onclick="togglePanel()">Hide Settings</button>
            </div>
            <div class="storage-warning" id="storageWarning">
                Your wheels have too many pictures to save in this browser, so they will not be remembered after you leave this page. Try using fewer or smaller pictures.
            </div>
            <div class="wheel-row" id="wheelRow"></div>
        </main>

        <aside class="panel" id="panel" aria-label="Wheel settings">
            <div class="panel-header">
                <h2>Wheel Settings</h2>
                <button class="icon-btn" title="Hide settings" aria-label="Hide settings" onclick="togglePanel()">&#10005;</button>
            </div>
            <div class="tabs" id="tabs"></div>
            <div class="panel-body" id="panelBody"></div>
            <div class="panel-footer">
                <span class="hint" style="margin:0;">Space = spin all</span>
                <button class="btn btn-danger btn-small" id="removeWheelBtn" onclick="removeActiveWheel()">Remove this wheel</button>
            </div>
        </aside>
    </div>

    <div class="modal-backdrop" id="resultModal" onclick="if (event.target === this) closeResults()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
            <div class="modal-header">
                <h2 id="resultTitle">Winner!</h2>
            </div>
            <ul class="result-list" id="resultList"></ul>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="spinAgain()">&#10047; Spin Again</button>
                <button class="btn btn-secondary" onclick="closeResults()">Close</button>
            </div>
        </div>
    </div>

    <!-- Shared hidden file inputs; JS points them at the right wheel/option before opening -->
    <input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePicInput(this)">
    <input type="file" id="bulkPicInput" accept="image/*" multiple style="display:none" onchange="handleBulkPicInput(this)">

    <script src="../js/sounds.js"></script>
    <script>
        const COLORS = [
            '#e74c3c', '#3498db', '#2ecc71', '#e67e22', '#9b59b6',
            '#1abc9c', '#34495e', '#e91e63', '#00bcd4', '#ff9800',
            '#795548', '#607d8b'
        ];
        const MAX_WHEELS = 10;
        const MAX_WEIGHT = 100;
        const PIC_SIZE = 160;           // stored picture size in pixels (square)
        const STORAGE_KEY = 'w68-spinner-wheels';
        const PRESETS = {
            'yes-no':  { label: 'Yes / No',    items: ['Yes', 'No'] },
            'numbers': { label: '1 - 6',       items: ['1', '2', '3', '4', '5', '6'] },
            'colors':  { label: 'Colors',      items: ['Red', 'Blue', 'Green', 'Yellow', 'Orange', 'Purple'] },
            'roles':   { label: 'Team Roles',  items: ['Reader', 'Recorder', 'Reporter', 'Time Keeper'] }
        };

        let wheels = [];
        let nextId = 1;
        let activeWheelId = null;  // wheel whose settings show in the panel
        let panelOpen = true;
        const batches = {};        // batchId -> { pending, results:[] } for spins started together
        let nextBatchId = 1;
        let modalResults = [];     // winners currently showing in the popup
        let picTarget = null;      // { wheelId, index } for the single-picture file input
        let bulkTarget = null;     // wheelId for the multi-picture file input
        const imageCache = {};     // dataURL -> HTMLImageElement, for canvas drawing

        // ---------- Model ----------
        // entry = { label: string, weight: number, image: dataURL | null }
        function makeEntries(labels) {
            return labels.map(l => ({ label: l, weight: 1, image: null }));
        }

        function newWheel(name) {
            return {
                id: nextId++,
                name: name || ('Wheel ' + (wheels.length + 1)),
                entries: makeEntries(['Option 1', 'Option 2', 'Option 3', 'Option 4']),
                weighted: false,
                selected: false,    // included in "Spin Selected"
                rotation: 0,
                spinning: false,
                batchId: null,      // which group of spins this wheel is part of while spinning
                lastWinner: null    // entry object of the most recent winner
            };
        }

        function getWheel(id) {
            return wheels.find(w => w.id === id);
        }

        function activeWheel() {
            return getWheel(activeWheelId) || wheels[0] || null;
        }

        function cleanWeight(v) {
            const n = Math.round(parseFloat(v));
            if (!isFinite(n) || n < 1) return 1;
            return Math.min(n, MAX_WEIGHT);
        }

        function cleanImage(v) {
            return (typeof v === 'string' && v.indexOf('data:image/') === 0) ? v : null;
        }

        function effectiveWeight(wheel, entry) {
            return wheel.weighted ? entry.weight : 1;
        }

        function totalWeight(wheel) {
            return wheel.entries.reduce((sum, e) => sum + effectiveWeight(wheel, e), 0);
        }

        function wedgeColor(index, count) {
            let color = COLORS[index % COLORS.length];
            // Avoid the last wedge matching the first one where they meet.
            if (count > 1 && index === count - 1 && color === COLORS[0]) {
                const prev = COLORS[(index - 1) % COLORS.length];
                color = COLORS.find(c => c !== COLORS[0] && c !== prev) || color;
            }
            return color;
        }

        // ---------- Persistence ----------
        function save() {
            const warning = document.getElementById('storageWarning');
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    panelOpen: panelOpen,
                    wheels: wheels.map(w => ({ name: w.name, weighted: w.weighted, selected: w.selected, entries: w.entries }))
                }));
                warning.classList.remove('active');
            } catch (e) {
                // Most likely the browser's storage quota (too many pictures).
                warning.classList.add('active');
            }
            layoutWheels();
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (!data || !Array.isArray(data.wheels)) return;
                if (typeof data.panelOpen === 'boolean') panelOpen = data.panelOpen;
                data.wheels.slice(0, MAX_WHEELS).forEach((saved, i) => {
                    const w = newWheel(String(saved.name || ('Wheel ' + (i + 1))));
                    w.weighted = !!saved.weighted;
                    w.selected = !!saved.selected;
                    const entries = Array.isArray(saved.entries) ? saved.entries : [];
                    w.entries = entries
                        .map(e => ({
                            label: String((e && e.label) || '').trim(),
                            weight: cleanWeight(e && e.weight),
                            image: cleanImage(e && e.image)
                        }))
                        .filter(e => e.label.length > 0);
                    wheels.push(w);
                });
            } catch (e) { /* corrupt or unavailable storage - start fresh */ }
        }

        // ---------- Layout ----------
        // Size every wheel so the whole row fits the stage with no scrolling.
        function layoutWheels() {
            const row = document.getElementById('wheelRow');
            const n = wheels.length;
            if (!n) return;
            const gap = 12;
            const cardPadding = 16;        // left + right padding of a card
            const cardChrome = 26 + 6 + 30 + 6 + 34 + 16 + 12; // head, gaps, result, button, padding, pointer
            const width = row.clientWidth;
            const height = row.clientHeight;
            if (!width || !height) return;

            const MIN_SIZE = 60;
            let size;
            let wrap = false;
            if (window.matchMedia('(max-width: 800px)').matches) {
                size = Math.min(width - cardPadding, 300);
                wrap = true;
            } else {
                const perRow = cols => Math.min((width - gap * (cols - 1)) / cols - cardPadding, height - cardChrome);
                size = perRow(n);
                if (size < MIN_SIZE && n > 1) {
                    // Too narrow for one row: fall back to two rows rather than spilling off screen.
                    const cols = Math.ceil(n / 2);
                    const twoRows = Math.min((width - gap * (cols - 1)) / cols - cardPadding, (height - gap) / 2 - cardChrome);
                    if (twoRows > size) { size = twoRows; wrap = true; }
                }
            }
            size = Math.max(MIN_SIZE, Math.floor(size));
            row.style.flexWrap = wrap ? 'wrap' : 'nowrap';
            row.style.setProperty('--wheel-size', size + 'px');
            row.style.setProperty('--row-gap', gap + 'px');
        }

        function togglePanel() {
            panelOpen = !panelOpen;
            applyPanelState();
            save();
        }

        function applyPanelState() {
            document.getElementById('panel').classList.toggle('collapsed', !panelOpen);
            document.getElementById('panelToggleBtn').textContent = panelOpen ? 'Hide Settings' : 'Show Settings';
            layoutWheels();
        }

        // ---------- Rendering ----------
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderAll() {
            if (!getWheel(activeWheelId)) activeWheelId = wheels.length ? wheels[0].id : null;

            const row = document.getElementById('wheelRow');
            row.innerHTML = '';
            wheels.forEach(w => {
                const card = document.createElement('div');
                card.className = 'wheel-card'
                    + (w.id === activeWheelId ? ' active' : '')
                    + (w.selected ? ' selected' : '');
                card.id = 'wheel-' + w.id;
                card.innerHTML = `
                    <div class="wheel-head">
                        <label class="select-toggle" title="Include this wheel in Spin Selected">
                            <input type="checkbox" aria-label="Select wheel" ${w.selected ? 'checked' : ''} onchange="toggleSelected(${w.id}, this.checked)">
                        </label>
                        <div class="wheel-title" title="Open settings for this wheel" onclick="selectWheel(${w.id})">${escapeHtml(w.name)}</div>
                        <button class="icon-btn edit" title="Wheel settings" aria-label="Wheel settings" onclick="selectWheel(${w.id})">&#9881;</button>
                    </div>
                    <div class="spinner-wrapper">
                        <div class="spinner-pointer"></div>
                        <canvas width="400" height="400" aria-label="Spinner wheel"></canvas>
                    </div>
                    <div class="wheel-result"></div>
                    <button class="btn btn-primary spin-btn" onclick="spinWheel(${w.id})">&#10047; Spin</button>
                `;
                row.appendChild(card);
                renderResult(w);
                drawWheel(w);
            });

            document.getElementById('wheelCount').textContent = wheels.length + ' of ' + MAX_WHEELS + ' wheels';
            renderTabs();
            renderPanel();
            updateButtons();
            layoutWheels();
        }

        function renderTabs() {
            const tabs = document.getElementById('tabs');
            let html = wheels.map((w, i) =>
                `<button class="tab ${w.id === activeWheelId ? 'active' : ''}" onclick="selectWheel(${w.id})" title="${escapeHtml(w.name)}">${i + 1}. ${escapeHtml(w.name)}</button>`
            ).join('');
            if (wheels.length < MAX_WHEELS) {
                html += `<button class="tab tab-add" onclick="addWheel()" title="Add a wheel">+ Add</button>`;
            }
            tabs.innerHTML = html;
        }

        function renderPanel() {
            const w = activeWheel();
            const body = document.getElementById('panelBody');
            const panel = document.getElementById('panel');
            if (!w) { body.innerHTML = ''; return; }

            const presetOptions = Object.keys(PRESETS)
                .map(k => `<option value="${k}">${escapeHtml(PRESETS[k].label)}</option>`).join('');

            body.innerHTML = `
                <div class="input-group">
                    <label for="wheelNameInput">Wheel name</label>
                    <input id="wheelNameInput" type="text" value="${escapeHtml(w.name)}" maxlength="40" placeholder="Wheel name"
                           oninput="renameWheel(${w.id}, this.value)">
                </div>
                <div class="input-group">
                    <label for="optionsText">Options (one per line)</label>
                    <textarea id="optionsText" rows="7" oninput="updateEntries(${w.id}, this.value)">${escapeHtml(w.entries.map(e => e.label).join('\n'))}</textarea>
                </div>
                <div class="editor-row">
                    <button class="btn btn-secondary" type="button" onclick="openBulkPicPicker(${w.id})">&#128247; Add pictures</button>
                    <select aria-label="Load a preset" onchange="applyPreset(${w.id}, this.value); this.value='';">
                        <option value="">Load a preset&hellip;</option>
                        ${presetOptions}
                    </select>
                </div>
                <label class="weight-toggle">
                    <input type="checkbox" id="weightedToggle" ${w.weighted ? 'checked' : ''} onchange="toggleWeighted(${w.id}, this.checked)">
                    Weighted wedges (uneven odds)
                </label>
                <div class="option-list" id="optionList"></div>
                <p class="hint">Click the picture box next to an option to add or change its picture. "Add pictures" creates one option per picture, named after the file. Weight = number of "tickets" an option holds: weight 3 is three times as likely to win as weight 1, and its wedge is three times as wide.</p>
            `;
            renderOptionList(w);
            panel.classList.toggle('spinning-wheel', w.spinning);
            document.getElementById('removeWheelBtn').disabled = wheels.length <= 1 || w.spinning;
        }

        function renderOptionList(w) {
            if (w.id !== activeWheelId) return;
            const list = document.getElementById('optionList');
            if (!list) return;
            const total = totalWeight(w) || 1;
            list.innerHTML = w.entries.map((e, i) => {
                const pct = Math.round((effectiveWeight(w, e) / total) * 1000) / 10;
                const pic = e.image
                    ? `<button class="pic-btn has-pic" type="button" title="Change picture" onclick="openPicPicker(${w.id}, ${i})"><img src="${e.image}" alt=""></button>
                       <button class="pic-clear" type="button" title="Remove picture" aria-label="Remove picture" onclick="clearPicture(${w.id}, ${i})">&#10005;</button>`
                    : `<button class="pic-btn" type="button" title="Add picture" aria-label="Add picture" onclick="openPicPicker(${w.id}, ${i})">&#128247;</button>`;
                const weight = w.weighted
                    ? `<input class="weight-input" type="number" min="1" max="${MAX_WEIGHT}" step="1" value="${e.weight}"
                               aria-label="Weight for ${escapeHtml(e.label)}" onchange="setWeight(${w.id}, ${i}, this.value)">
                       <span class="pct">${pct}%</span>`
                    : '';
                return `
                    <div class="option-row">
                        <span class="swatch" style="background:${wedgeColor(i, w.entries.length)}"></span>
                        <span class="olabel" title="${escapeHtml(e.label)}">${escapeHtml(e.label)}</span>
                        ${pic}
                        ${weight}
                    </div>`;
            }).join('');
        }

        function renderResult(w) {
            const card = document.getElementById('wheel-' + w.id);
            if (!card) return;
            const el = card.querySelector('.wheel-result');
            if (w.entries.length < 2) {
                el.innerHTML = '<span class="wheel-empty">Add 2+ options</span>';
            } else if (w.lastWinner) {
                el.innerHTML = (w.lastWinner.image ? `<img src="${w.lastWinner.image}" alt="">` : '')
                    + `<span title="${escapeHtml(w.lastWinner.label)}">${escapeHtml(w.lastWinner.label)}</span>`;
            } else {
                el.innerHTML = '';
            }
        }

        function updateButtons() {
            const idle = wheels.filter(w => !w.spinning && w.entries.length >= 2);
            const selectedIdle = idle.filter(w => w.selected);
            const selectedCount = wheels.filter(w => w.selected).length;

            document.getElementById('spinAllBtn').disabled = idle.length === 0;
            const selBtn = document.getElementById('spinSelectedBtn');
            selBtn.disabled = selectedIdle.length === 0;
            selBtn.innerHTML = '&#10047; Spin Selected' + (selectedCount ? ' (' + selectedCount + ')' : '');
            document.getElementById('addWheelBtn').disabled = wheels.length >= MAX_WHEELS;

            wheels.forEach(w => {
                const card = document.getElementById('wheel-' + w.id);
                if (!card) return;
                card.querySelector('.spin-btn').disabled = w.spinning;
            });

            const a = activeWheel();
            document.getElementById('panel').classList.toggle('spinning-wheel', !!(a && a.spinning));
            document.getElementById('removeWheelBtn').disabled = !a || wheels.length <= 1 || a.spinning;
        }

        // ---------- Drawing ----------
        function getImage(dataUrl, onReady) {
            let img = imageCache[dataUrl];
            if (!img) {
                img = new Image();
                img.onload = onReady;
                img.src = dataUrl;
                imageCache[dataUrl] = img;
            }
            return img;
        }

        function fitText(ctx, text, maxWidth, maxFont) {
            let size = maxFont;
            ctx.font = `bold ${size}px sans-serif`;
            while (ctx.measureText(text).width > maxWidth && size > 9) {
                size -= 1;
                ctx.font = `bold ${size}px sans-serif`;
            }
            if (ctx.measureText(text).width <= maxWidth) return text;
            let t = text;
            while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) {
                t = t.slice(0, -1);
            }
            return t + '…';
        }

        function drawWheel(w) {
            const card = document.getElementById('wheel-' + w.id);
            if (!card) return;
            const canvas = card.querySelector('canvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (w.entries.length === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.fillStyle = '#e9ecef';
                ctx.fill();
                ctx.fillStyle = '#8a949c';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('No options yet', cx, cy);
                return;
            }

            const total = totalWeight(w);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(w.rotation);

            let start = 0;
            w.entries.forEach((e, i) => {
                const angle = (effectiveWeight(w, e) / total) * 2 * Math.PI;
                const end = start + angle;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, r, start, end);
                ctx.closePath();
                ctx.fillStyle = wedgeColor(i, w.entries.length);
                ctx.fill();
                if (w.entries.length > 1) {
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                if (angle > 0.09) {
                    const mid = start + angle / 2;
                    const img = e.image ? getImage(e.image, () => drawWheel(w)) : null;

                    if (img && img.complete && img.naturalWidth > 0) {
                        // Picture: a circle centred part-way along the wedge, sized to fit its width.
                        const picRadius = r * 0.62;
                        const width = 2 * picRadius * Math.sin(Math.min(angle, Math.PI) / 2);
                        const size = Math.min(width * 0.85, r * 0.42, picRadius - 32);
                        if (size >= 14) {
                            ctx.save();
                            ctx.rotate(mid);
                            ctx.translate(picRadius, 0);
                            ctx.beginPath();
                            ctx.arc(0, 0, size / 2, 0, 2 * Math.PI);
                            ctx.closePath();
                            ctx.fillStyle = 'white';
                            ctx.fill();
                            ctx.clip();
                            ctx.drawImage(img, -size / 2, -size / 2, size, size);
                            ctx.restore();
                        }
                    } else {
                        const textRadius = r - 18;
                        const innerRadius = 34;
                        const maxWidth = textRadius - innerRadius;
                        const maxHeight = 2 * (r * 0.55) * Math.sin(Math.min(angle, Math.PI) / 2);
                        const maxFont = Math.max(10, Math.min(26, Math.floor(maxHeight * 0.85)));

                        ctx.save();
                        ctx.rotate(mid);
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = 'white';
                        ctx.shadowColor = 'rgba(0,0,0,0.35)';
                        ctx.shadowBlur = 3;
                        const label = fitText(ctx, e.label, maxWidth, maxFont);
                        ctx.fillText(label, textRadius, 0);
                        ctx.restore();
                    }
                }
                start = end;
            });

            // Center hub
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        // ---------- Wheel management ----------
        function refreshWheel(w) {
            save();
            renderOptionList(w);
            renderResult(w);
            drawWheel(w);
        }

        function syncTextarea(w) {
            if (w.id !== activeWheelId) return;
            const ta = document.getElementById('optionsText');
            if (ta) ta.value = w.entries.map(e => e.label).join('\n');
        }

        function selectWheel(id) {
            if (!getWheel(id)) return;
            activeWheelId = id;
            if (!panelOpen) { panelOpen = true; applyPanelState(); }
            wheels.forEach(w => {
                const card = document.getElementById('wheel-' + w.id);
                if (card) card.classList.toggle('active', w.id === id);
            });
            renderTabs();
            renderPanel();
            updateButtons();
            save();
        }

        function addWheel() {
            if (wheels.length >= MAX_WHEELS) return;
            const w = newWheel();
            wheels.push(w);
            activeWheelId = w.id;
            if (!panelOpen) { panelOpen = true; applyPanelState(); }
            save();
            renderAll();
            const ta = document.getElementById('optionsText');
            if (ta) ta.focus();
        }

        function removeActiveWheel() {
            const w = activeWheel();
            if (!w || wheels.length <= 1 || w.spinning) return;
            if (!confirm('Remove "' + w.name + '" and its options?')) return;
            const idx = wheels.indexOf(w);
            wheels = wheels.filter(x => x.id !== w.id);
            const next = wheels[Math.min(idx, wheels.length - 1)];
            activeWheelId = next ? next.id : null;
            save();
            renderAll();
        }

        function renameWheel(id, value) {
            const w = getWheel(id);
            if (!w) return;
            w.name = value;
            const card = document.getElementById('wheel-' + id);
            if (card) card.querySelector('.wheel-title').textContent = value;
            renderTabs();
            save();
        }

        function toggleSelected(id, checked) {
            const w = getWheel(id);
            if (!w) return;
            w.selected = checked;
            const card = document.getElementById('wheel-' + id);
            if (card) card.classList.toggle('selected', checked);
            save();
            updateButtons();
        }

        function updateEntries(id, text) {
            const w = getWheel(id);
            if (!w) return;
            const labels = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const old = w.entries.slice();

            if (labels.length === old.length) {
                // Same number of lines: treat as renames, keep weights and pictures by position.
                w.entries = labels.map((label, i) => ({ label: label, weight: old[i].weight, image: old[i].image }));
            } else {
                // Lines added or removed: keep weight/picture for labels that still exist.
                w.entries = labels.map(label => {
                    const idx = old.findIndex(e => e.label === label);
                    if (idx >= 0) {
                        const kept = old.splice(idx, 1)[0];
                        return { label: label, weight: kept.weight, image: kept.image };
                    }
                    return { label: label, weight: 1, image: null };
                });
            }
            w.lastWinner = null;
            refreshWheel(w);
            updateButtons();
        }

        function applyPreset(id, key) {
            const w = getWheel(id);
            const preset = PRESETS[key];
            if (!w || !preset) return;
            w.entries = makeEntries(preset.items);
            w.lastWinner = null;
            syncTextarea(w);
            refreshWheel(w);
            updateButtons();
        }

        function toggleWeighted(id, checked) {
            const w = getWheel(id);
            if (!w) return;
            w.weighted = checked;
            refreshWheel(w);
        }

        function setWeight(id, index, value) {
            const w = getWheel(id);
            if (!w || !w.entries[index]) return;
            w.entries[index].weight = cleanWeight(value);
            refreshWheel(w);
        }

        function removeEntry(id, label) {
            const w = getWheel(id);
            if (!w) return;
            const idx = w.entries.findIndex(e => e.label === label);
            if (idx < 0) return;
            w.entries.splice(idx, 1);
            w.lastWinner = null;
            syncTextarea(w);
            refreshWheel(w);
            updateButtons();
        }

        // ---------- Pictures ----------
        // Shrink an uploaded file to a small square data URL so many pictures fit in localStorage.
        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type || file.type.indexOf('image/') !== 0) {
                    reject(new Error('Not an image'));
                    return;
                }
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('Could not read file'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Could not decode image'));
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        c.width = PIC_SIZE;
                        c.height = PIC_SIZE;
                        const ctx = c.getContext('2d');
                        // Cover-crop to a centred square
                        const side = Math.min(img.naturalWidth, img.naturalHeight);
                        const sx = (img.naturalWidth - side) / 2;
                        const sy = (img.naturalHeight - side) / 2;
                        ctx.drawImage(img, sx, sy, side, side, 0, 0, PIC_SIZE, PIC_SIZE);
                        const keepAlpha = file.type === 'image/png' || file.type === 'image/gif' || file.type === 'image/svg+xml' || file.type === 'image/webp';
                        resolve(keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function labelFromFilename(name) {
            const base = String(name || '').replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim();
            return base || 'Picture';
        }

        function openPicPicker(wheelId, index) {
            picTarget = { wheelId: wheelId, index: index };
            const input = document.getElementById('picInput');
            input.value = '';
            input.click();
        }

        function openBulkPicPicker(wheelId) {
            bulkTarget = wheelId;
            const input = document.getElementById('bulkPicInput');
            input.value = '';
            input.click();
        }

        function handlePicInput(input) {
            const target = picTarget;
            picTarget = null;
            const file = input.files && input.files[0];
            if (!target || !file) return;
            fileToDataUrl(file).then(dataUrl => {
                const w = getWheel(target.wheelId);
                if (!w || !w.entries[target.index]) return;
                w.entries[target.index].image = dataUrl;
                refreshWheel(w);
            }).catch(() => alert('That file could not be used as a picture. Please choose an image file (JPG, PNG, GIF).'));
        }

        function handleBulkPicInput(input) {
            const wheelId = bulkTarget;
            bulkTarget = null;
            const files = Array.from(input.files || []);
            const w = getWheel(wheelId);
            if (!w || files.length === 0) return;
            Promise.all(files.map(f => fileToDataUrl(f).then(
                dataUrl => ({ label: labelFromFilename(f.name), weight: 1, image: dataUrl }),
                () => null
            ))).then(results => {
                const added = results.filter(Boolean);
                const skipped = results.length - added.length;
                if (added.length) {
                    // Avoid duplicate labels, which are used to match options
                    const used = new Set(w.entries.map(e => e.label));
                    added.forEach(e => {
                        let label = e.label, n = 2;
                        while (used.has(label)) { label = e.label + ' ' + n++; }
                        e.label = label;
                        used.add(label);
                    });
                    w.entries = w.entries.concat(added);
                    w.lastWinner = null;
                    syncTextarea(w);
                    refreshWheel(w);
                    updateButtons();
                }
                if (skipped) alert(skipped + ' file(s) were skipped because they are not images.');
            });
        }

        function clearPicture(wheelId, index) {
            const w = getWheel(wheelId);
            if (!w || !w.entries[index]) return;
            w.entries[index].image = null;
            refreshWheel(w);
        }

        // ---------- Spinning ----------
        function pickWinner(w) {
            const total = totalWeight(w);
            let r = Math.random() * total;
            for (let i = 0; i < w.entries.length; i++) {
                r -= effectiveWeight(w, w.entries[i]);
                if (r < 0) return i;
            }
            return w.entries.length - 1;
        }

        function wedgeBounds(w, index) {
            const total = totalWeight(w);
            let start = 0;
            for (let i = 0; i < index; i++) {
                start += (effectiveWeight(w, w.entries[i]) / total) * 2 * Math.PI;
            }
            const angle = (effectiveWeight(w, w.entries[index]) / total) * 2 * Math.PI;
            return { start: start, end: start + angle };
        }

        function spinWheel(id) {
            const w = getWheel(id);
            if (!w || w.spinning) return;
            if (w.entries.length < 2) {
                alert('Add at least 2 options to "' + w.name + '" before spinning.');
                return;
            }
            startSpin([w]);
        }

        function spinAll() {
            const ready = wheels.filter(w => !w.spinning && w.entries.length >= 2);
            if (ready.length === 0) {
                if (!wheels.some(w => w.spinning)) alert('Add at least 2 options to a wheel before spinning.');
                return;
            }
            startSpin(ready);
        }

        function spinSelected() {
            const chosen = wheels.filter(w => w.selected);
            if (chosen.length === 0) {
                alert('Tick the box on the wheels you want to spin together first.');
                return;
            }
            const ready = chosen.filter(w => !w.spinning && w.entries.length >= 2);
            if (ready.length === 0) return;
            startSpin(ready);
        }

        function spinAgain() {
            const ids = modalResults.map(r => r.wheelId);
            closeResults();
            const targets = wheels.filter(w => ids.includes(w.id) && !w.spinning && w.entries.length >= 2);
            if (targets.length === 0) return;
            startSpin(targets);
        }

        function startSpin(targets) {
            targets = targets.filter(w => !w.spinning && w.entries.length >= 2);
            if (targets.length === 0) return;

            // Starting a new spin hides any winners still showing so the wheels are visible.
            closeResults();

            const batchId = nextBatchId++;
            batches[batchId] = { pending: targets.length, results: [] };
            playWhoosh();

            const POINTER = 3 * Math.PI / 2; // pointer sits at the top of the wheel
            const TWO_PI = 2 * Math.PI;

            targets.forEach((w, i) => {
                w.spinning = true;
                w.batchId = batchId;
                w.lastWinner = null;
                renderResult(w);

                // Choose the winner by weight first, then aim the wheel so it lands there.
                const winnerIndex = pickWinner(w);
                const winner = w.entries[winnerIndex];
                const bounds = wedgeBounds(w, winnerIndex);
                const wedge = bounds.end - bounds.start;
                const margin = Math.min(wedge * 0.12, 0.03);
                const landing = bounds.start + margin + Math.random() * (wedge - 2 * margin);
                const finalRotation = ((POINTER - landing) % TWO_PI + TWO_PI) % TWO_PI;

                const currentMod = ((w.rotation % TWO_PI) + TWO_PI) % TWO_PI;
                const delta = ((finalRotation - currentMod) % TWO_PI + TWO_PI) % TWO_PI;
                const fullTurns = 4 + Math.floor(Math.random() * 3);
                const totalRotation = fullTurns * TWO_PI + delta;

                const startRotation = w.rotation;
                const duration = 3000 + Math.random() * 1500 + (targets.length > 1 ? i * 150 : 0);
                const startTime = performance.now();

                function animate(now) {
                    const progress = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    w.rotation = startRotation + totalRotation * eased;
                    drawWheel(w);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        w.rotation = finalRotation;
                        drawWheel(w);
                        w.spinning = false;
                        w.lastWinner = winner;
                        renderResult(w);
                        finishOne(w, winnerIndex);
                    }
                }
                requestAnimationFrame(animate);
            });
            updateButtons();
        }

        function finishOne(w, winnerIndex) {
            const batchId = w.batchId;
            const batch = batches[batchId];
            w.batchId = null;
            updateButtons();
            if (!batch) return;
            const entry = w.entries[winnerIndex];
            batch.results.push({
                wheelId: w.id,
                wheelName: w.name,
                winner: entry.label,
                image: entry.image,
                color: wedgeColor(winnerIndex, w.entries.length)
            });
            batch.pending -= 1;
            if (batch.pending <= 0) {
                delete batches[batchId];
                showResults(batch.results);
            }
        }

        // ---------- Winner popup ----------
        function showResults(results) {
            const modal = document.getElementById('resultModal');
            const list = document.getElementById('resultList');

            // If winners from another group are already showing, add these to the same popup.
            if (!modal.classList.contains('active')) modalResults = [];
            results.forEach(r => {
                modalResults = modalResults.filter(x => x.wheelId !== r.wheelId);
                modalResults.push(r);
            });

            // Keep results in on-screen wheel order
            const order = wheels.map(w => w.id);
            modalResults.sort((a, b) => order.indexOf(a.wheelId) - order.indexOf(b.wheelId));

            list.dataset.count = modalResults.length;
            list.innerHTML = modalResults.map(r => `
                <li class="result-item" style="--c:${r.color}">
                    ${r.image ? `<img class="r-pic" src="${r.image}" alt="">` : ''}
                    <div class="r-body">
                        <div class="r-wheel">${escapeHtml(r.wheelName || 'Wheel')}</div>
                        <div class="r-winner">${escapeHtml(r.winner)}</div>
                    </div>
                    <button class="btn btn-secondary btn-small" title="Remove this option from the wheel"
                            onclick="removeEntry(${r.wheelId}, this.dataset.label); this.disabled = true; this.textContent = 'Removed';"
                            data-label="${escapeHtml(r.winner)}">Remove</button>
                </li>`).join('');

            document.getElementById('resultTitle').textContent = modalResults.length === 1 ? 'Winner!' : 'Winners!';
            modal.classList.add('active');
            playChime();
        }

        function closeResults() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // ---------- Init ----------
        load();
        if (wheels.length === 0) wheels.push(newWheel());
        activeWheelId = wheels[0].id;
        applyPanelState();
        renderAll();

        window.addEventListener('resize', layoutWheels);

        document.addEventListener('keydown', (e) => {
            const tag = (e.target.tagName || '').toLowerCase();
            const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
            if (e.key === 'Escape') {
                closeResults();
            } else if (e.key === ' ' && !typing) {
                e.preventDefault();
                if (document.getElementById('resultModal').classList.contains('active')) {
                    closeResults();
                } else {
                    spinAll();
                }
            }
        });
    </script>
</body>
</html>
