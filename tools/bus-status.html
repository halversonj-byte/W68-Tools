<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bus Board - Thomas Jefferson Junior High</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root { --tool-color: #1565c0; }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0d1b2a;
            overflow: hidden;
            margin: 0;
        }

        /* ---- Header ---- */
        .bus-header {
            background: #0d1b2a;
            color: white;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bus-header .back-link {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            opacity: 0.4;
            margin-right: 1rem;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .bus-header .back-link:hover {
            opacity: 1;
        }

        .header-titles {
            flex: 1;
        }

        .bus-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.15;
            margin: 0;
        }

        .bus-header .subtitle {
            font-size: 1.15rem;
            font-weight: 400;
            opacity: 0.7;
        }

        .admin-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            color: rgba(255, 255, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .admin-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ---- Setup Banner ---- */
        .setup-banner {
            background: #1b2838;
            color: #ffa726;
            padding: 0.5rem 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .setup-banner .dismiss {
            cursor: pointer;
            margin-left: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            vertical-align: middle;
        }

        /* ---- Bus Grid ---- */
        .bus-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.75rem;
            padding: 0.75rem;
        }

        /* ---- Bus Card ---- */
        .bus-card {
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .bus-card.editable {
            cursor: pointer;
        }

        .bus-card.editable:active {
            transform: scale(0.96);
        }

        .bus-icon {
            width: clamp(2.5rem, 5vh, 4.5rem);
            height: clamp(2rem, 4vh, 3.5rem);
            margin-bottom: 0.1rem;
        }

        .bus-icon svg {
            width: 100%;
            height: 100%;
        }

        .bus-number {
            font-size: clamp(3rem, 9vh, 7rem);
            font-weight: 800;
            color: white;
            line-height: 1;
        }

        .bus-status-text {
            font-size: clamp(0.9rem, 2.2vh, 1.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.9);
            min-height: clamp(1rem, 2.5vh, 1.6rem);
            margin-top: 0.1rem;
        }

        /* ---- Card States ---- */
        .bus-card.waiting {
            background: #1b3a5c;
        }

        .bus-card.waiting .bus-status-text {
            color: rgba(255, 255, 255, 0.3);
        }

        .bus-card.late {
            background: #dc2626;
            border-color: rgba(255, 255, 255, 0.2);
            animation: pulse-red 2s ease-in-out infinite;
        }

        .bus-card.arrived {
            background: #22c55e;
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 rgba(220, 38, 38, 0); }
            50%       { box-shadow: 0 0 30px rgba(220, 38, 38, 0.5); }
        }

        @keyframes card-pop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .bus-card.pop {
            animation: card-pop 0.25s ease;
        }

        /* ---- Admin Toolbar ---- */
        .admin-toolbar {
            display: none;
            padding: 0.5rem 1.25rem;
            background: #0a1220;
            flex-shrink: 0;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .admin-toolbar.visible {
            display: flex;
        }

        .reset-btn {
            background: #374151;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: #4b5563;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.8rem;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a047;
            flex-shrink: 0;
        }

        .connection-dot.offline { background: #e53935; }
        .connection-dot.local   { background: #ffa726; }

        /* ---- Responsive: Tablet ---- */
        @media (max-width: 900px) {
            .bus-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
            }
            .bus-header h1 { font-size: 1.35rem; }
            .bus-header .subtitle { font-size: 0.9rem; }
        }

        /* ---- Responsive: Phone ---- */
        @media (max-width: 600px) {
            body { overflow: auto; }
            .bus-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(6, 1fr);
                gap: 0.5rem;
                padding: 0.5rem;
            }
            .bus-header { padding: 0.5rem 0.75rem; }
            .bus-header h1 { font-size: 1.1rem; }
            .bus-header .subtitle { font-size: 0.75rem; }
            .bus-header .back-link { margin-right: 0.5rem; font-size: 1.1rem; }
            .admin-btn { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
        }
    </style>
</head>
<body>

    <header class="bus-header">
        <a href="../index.html" class="back-link" aria-label="Back to tools">&#8592;</a>
        <div class="header-titles">
            <h1>Thomas Jefferson Junior High</h1>
            <div class="subtitle">Bus Board</div>
        </div>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">Admin</button>
    </header>

    <div class="setup-banner" id="setupBanner" style="display:none;">
        Real-time sync is not configured &mdash; changes will only appear on this device.
        See the source code comments for Firebase setup instructions.
        <span class="dismiss" onclick="this.parentElement.style.display='none'" title="Dismiss">&times;</span>
    </div>

    <main class="bus-grid" id="busGrid"></main>

    <div class="admin-toolbar" id="adminToolbar">
        <button class="reset-btn" onclick="resetAll()">&#8634; Reset All</button>
        <div class="connection-status">
            <div class="connection-dot local" id="connectionDot"></div>
            <span id="connectionText">Local Only</span>
        </div>
    </div>

    <!-- Firebase SDK (loaded from CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <script>
        // =====================================================
        //  FIREBASE CONFIGURATION
        // =====================================================
        //  To enable real-time sync across multiple devices:
        //
        //  1. Go to  https://console.firebase.google.com
        //  2. Click "Create a project" (name it e.g. "tj-bus-status")
        //  3. Once created, click the web icon (</>) to register a web app
        //  4. Copy the firebaseConfig values into the object below
        //  5. In the Firebase console go to Build > Realtime Database
        //  6. Click "Create Database", pick your region, start in TEST mode
        //  7. Reload this page — all devices sharing the URL will now sync
        //
        //  Recommended Realtime Database rules for production:
        //  {
        //    "rules": {
        //      "bus-status": { ".read": true, ".write": true }
        //    }
        //  }
        // =====================================================
        const FIREBASE_CONFIG = {
            apiKey:            "",
            authDomain:        "",
            databaseURL:       "",
            projectId:         "",
            storageBucket:     "",
            messagingSenderId: "",
            appId:             ""
        };

        // =====================================================
        //  BUS CONFIGURATION — change the count if needed
        // =====================================================
        const BUS_COUNT = 12;

        // =====================================================
        //  BUS SVG ICON (side-view school bus)
        // =====================================================
        var BUS_SVG =
            '<svg viewBox="0 0 100 64" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
            '<rect x="4" y="8" width="92" height="34" rx="5"/>' +
            '<line x1="4" y1="22" x2="96" y2="22"/>' +
            '<rect x="11" y="12" width="13" height="7" rx="2"/>' +
            '<rect x="28" y="12" width="13" height="7" rx="2"/>' +
            '<rect x="45" y="12" width="13" height="7" rx="2"/>' +
            '<rect x="62" y="12" width="13" height="7" rx="2"/>' +
            '<rect x="80" y="25" width="8" height="13" rx="2"/>' +
            '<circle cx="24" cy="48" r="6"/>' +
            '<circle cx="72" cy="48" r="6"/>' +
            '<line x1="4" y1="42" x2="16" y2="42"/>' +
            '<line x1="32" y1="42" x2="64" y2="42"/>' +
            '<line x1="80" y1="42" x2="96" y2="42"/>' +
            '</svg>';

        // =====================================================
        //  APPLICATION CODE
        // =====================================================
        var STATES = ['waiting', 'late', 'arrived'];
        var busStates = {};
        var firebaseReady = false;
        var dbRef = null;
        var adminMode = false;

        // ---------- Initialise ----------
        function init() {
            createBusCards();
            initFirebase();
        }

        // ---------- Build the grid ----------
        function createBusCards() {
            var grid = document.getElementById('busGrid');
            for (var i = 1; i <= BUS_COUNT; i++) {
                busStates[i] = 'waiting';
                var card = document.createElement('div');
                card.className = 'bus-card waiting';
                card.dataset.bus = i;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', 'Bus ' + i + ' - tap to change status');
                (function (num) {
                    card.onclick = function () { toggleBus(num); };
                })(i);
                card.innerHTML =
                    '<div class="bus-icon">' + BUS_SVG + '</div>' +
                    '<div class="bus-number">' + i + '</div>' +
                    '<div class="bus-status-text"></div>';
                grid.appendChild(card);
            }
        }

        // ---------- Admin mode ----------
        function toggleAdmin() {
            adminMode = !adminMode;
            var btn = document.getElementById('adminBtn');
            var toolbar = document.getElementById('adminToolbar');
            btn.classList.toggle('active', adminMode);
            toolbar.classList.toggle('visible', adminMode);

            var cards = document.querySelectorAll('.bus-card');
            for (var j = 0; j < cards.length; j++) {
                cards[j].classList.toggle('editable', adminMode);
            }
        }

        // ---------- Toggle a bus ----------
        function toggleBus(busNumber) {
            if (!adminMode) return;

            var idx = STATES.indexOf(busStates[busNumber]);
            var next = STATES[(idx + 1) % STATES.length];
            busStates[busNumber] = next;
            updateBusCard(busNumber, true);

            if (firebaseReady && dbRef) {
                dbRef.child(String(busNumber)).set(next);
            }
        }

        // ---------- Render one card ----------
        function updateBusCard(busNumber, animate) {
            var card = document.querySelector('[data-bus="' + busNumber + '"]');
            if (!card) return;

            // Preserve editable class
            var classes = 'bus-card ' + busStates[busNumber];
            if (adminMode) classes += ' editable';
            card.className = classes;

            var label = card.querySelector('.bus-status-text');
            if (busStates[busNumber] === 'late') {
                label.textContent = 'LATE';
            } else if (busStates[busNumber] === 'arrived') {
                label.textContent = 'ARRIVED';
            } else {
                label.textContent = '';
            }

            if (animate) {
                card.classList.add('pop');
                setTimeout(function () { card.classList.remove('pop'); }, 260);
            }
        }

        // ---------- Firebase ----------
        function initFirebase() {
            if (!FIREBASE_CONFIG.apiKey) {
                document.getElementById('setupBanner').style.display = '';
                return;
            }

            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                var db = firebase.database();
                dbRef = db.ref('bus-status');

                // Real-time listener
                dbRef.on('value', function (snapshot) {
                    var data = snapshot.val() || {};
                    for (var i = 1; i <= BUS_COUNT; i++) {
                        var incoming = data[i] || 'waiting';
                        if (busStates[i] !== incoming) {
                            busStates[i] = incoming;
                            updateBusCard(i, true);
                        }
                    }
                });

                // Connection monitor
                db.ref('.info/connected').on('value', function (snap) {
                    var dot  = document.getElementById('connectionDot');
                    var text = document.getElementById('connectionText');
                    if (snap.val() === true) {
                        dot.className  = 'connection-dot';
                        text.textContent = 'Connected';
                        firebaseReady = true;
                    } else {
                        dot.className  = 'connection-dot offline';
                        text.textContent = 'Reconnecting\u2026';
                    }
                });

                firebaseReady = true;
            } catch (err) {
                console.error('Firebase init error:', err);
                document.getElementById('setupBanner').style.display = '';
            }
        }

        // ---------- Reset all buses ----------
        function resetAll() {
            if (!confirm('Reset all buses to waiting?')) return;

            for (var i = 1; i <= BUS_COUNT; i++) {
                busStates[i] = 'waiting';
                updateBusCard(i, false);
            }

            if (firebaseReady && dbRef) {
                var updates = {};
                for (var j = 1; j <= BUS_COUNT; j++) {
                    updates[j] = 'waiting';
                }
                dbRef.set(updates);
            }
        }

        // ---------- Keyboard shortcuts ----------
        document.addEventListener('keydown', function (e) {
            if (!adminMode) return;
            var n = parseInt(e.key, 10);
            if (n >= 1 && n <= 9) toggleBus(n);
            if (e.key === '0') toggleBus(10);
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
