<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bus Board - Woodridge School District 68</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --w68-blue: #0a1f62;
            --w68-blue-light: #0f2a7a;
            --arrived-green: #22c55e;
            --late-red: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--w68-blue);
            overflow: hidden;
            color: white;
        }

        /* ---- Header ---- */
        .bus-header {
            background: var(--w68-blue);
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header-titles {
            flex: 1;
            text-align: center;
        }

        .bus-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .bus-header .subtitle {
            font-size: 1rem;
            font-weight: 600;
            opacity: 0.7;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ---- Setup Banner ---- */
        .setup-banner {
            background: #1b2838;
            color: #ffa726;
            padding: 0.5rem 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .setup-banner .dismiss {
            cursor: pointer;
            margin-left: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            vertical-align: middle;
        }

        /* ---- Bus Grid ---- */
        .bus-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.6rem;
            padding: 0.6rem;
        }

        /* ---- Bus Card ---- */
        .bus-card {
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, transform 0.1s ease;
            position: relative;
            border: 3px solid rgba(255, 255, 255, 0.15);
            padding: 0.5rem 0;
            overflow: hidden;
        }

        .bus-card:active {
            transform: scale(0.96);
        }

        /* ---- Bus Icon ---- */
        .bus-icon {
            width: clamp(5rem, 11vw, 9rem);
            height: clamp(3.5rem, 8vw, 6.5rem);
            flex-shrink: 0;
        }

        .bus-icon svg {
            width: 100%;
            height: 100%;
        }

        .bus-number {
            font-size: clamp(2.2rem, 7vh, 5.5rem);
            font-weight: 900;
            color: white;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .bus-status-text {
            font-size: clamp(0.75rem, 1.8vh, 1.2rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.95);
            margin-top: 0.15rem;
        }

        /* ---- Card States ---- */
        .bus-card.arrived {
            background: var(--arrived-green);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .bus-card.late {
            background: var(--late-red);
            border-color: rgba(255, 255, 255, 0.3);
            animation: pulse-red 2s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 rgba(220, 38, 38, 0); }
            50%       { box-shadow: 0 0 35px rgba(220, 38, 38, 0.6); }
        }

        @keyframes card-pop {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .bus-card.pop {
            animation: card-pop 0.25s ease;
        }

        /* ---- Bottom Bar ---- */
        .bottom-bar {
            padding: 0.4rem 1.25rem;
            background: rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.35rem 0.9rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a047;
            flex-shrink: 0;
        }

        .connection-dot.offline { background: #e53935; }
        .connection-dot.local   { background: #ffa726; }

        /* ---- Responsive: Tablet ---- */
        @media (max-width: 900px) {
            .bus-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
            }
            .bus-header h1 { font-size: 1.3rem; }
            .bus-header .subtitle { font-size: 0.85rem; }
        }

        /* ---- Responsive: Phone ---- */
        @media (max-width: 600px) {
            body { overflow: auto; }
            .bus-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(6, 1fr);
                gap: 0.4rem;
                padding: 0.4rem;
            }
            .bus-header { padding: 0.4rem 0.75rem; }
            .bus-header h1 { font-size: 1rem; }
            .bus-header .subtitle { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <header class="bus-header">
        <div class="header-titles">
            <h1>Woodridge School District 68</h1>
            <div class="subtitle">Bus Board &mdash; Thomas Jefferson Junior High</div>
        </div>
    </header>

    <div class="setup-banner" id="setupBanner" style="display:none;">
        Real-time sync is not configured &mdash; changes will only appear on this device.
        <span class="dismiss" onclick="this.parentElement.style.display='none'" title="Dismiss">&times;</span>
    </div>

    <main class="bus-grid" id="busGrid"></main>

    <div class="bottom-bar">
        <button class="reset-btn" onclick="resetAll()">&#8634; Reset All to Arrived</button>
        <div class="connection-status">
            <div class="connection-dot local" id="connectionDot"></div>
            <span id="connectionText">Local Only</span>
        </div>
    </div>

    <!-- Supabase SDK (loaded from CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // =====================================================
        //  SUPABASE CONFIGURATION
        // =====================================================
        //  To enable real-time sync across multiple devices:
        //
        //  1. Go to  https://supabase.com  and create a free account
        //  2. Click "New Project", name it e.g. "tj-bus-status"
        //  3. Wait for the project to finish provisioning
        //  4. Go to the SQL Editor (left sidebar) and run this SQL:
        //
        //     CREATE TABLE bus_status (
        //         bus_number INTEGER PRIMARY KEY,
        //         status TEXT NOT NULL DEFAULT 'arrived'
        //     );
        //
        //     INSERT INTO bus_status (bus_number, status)
        //     VALUES (1,'arrived'),(2,'arrived'),(3,'arrived'),(4,'arrived'),
        //            (5,'arrived'),(6,'arrived'),(7,'arrived'),(8,'arrived'),
        //            (9,'arrived'),(10,'arrived'),(11,'arrived'),(12,'arrived');
        //
        //     ALTER TABLE bus_status DISABLE ROW LEVEL SECURITY;
        //
        //     ALTER PUBLICATION supabase_realtime ADD TABLE bus_status;
        //
        //  5. Go to Settings > API (left sidebar)
        //  6. Copy the "Project URL" into SUPABASE_URL below
        //  7. Copy the "anon public" key into SUPABASE_KEY below
        //  8. Deploy this page to GitHub Pages — all devices will sync!
        //
        // =====================================================
        var SUPABASE_URL = 'https://kornaxmebpmdoohycymm.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_-MusWRGQab0ngWEvFzvzpA_08kS4htu';

        // =====================================================
        //  BUS CONFIGURATION
        // =====================================================
        var BUS_COUNT = 12;

        // =====================================================
        //  BUS SVG ICON (detailed side-view school bus)
        // =====================================================
        var BUS_SVG =
            '<svg viewBox="0 0 120 72" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            // Bus body
            '<rect x="5" y="14" width="110" height="36" rx="4" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2.5"/>' +
            // Roof line
            '<path d="M9 14 L9 8 Q9 5 12 5 L100 5 Q103 5 103 8 L103 14" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.1)"/>' +
            // Windows
            '<rect x="14" y="8" width="12" height="8" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>' +
            '<rect x="30" y="8" width="12" height="8" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>' +
            '<rect x="46" y="8" width="12" height="8" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>' +
            '<rect x="62" y="8" width="12" height="8" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>' +
            '<rect x="78" y="8" width="12" height="8" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>' +
            // Door
            '<rect x="96" y="22" width="10" height="22" rx="2" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="1.8"/>' +
            '<line x1="101" y1="22" x2="101" y2="44" stroke="white" stroke-width="1"/>' +
            // Bumper
            '<rect x="3" y="50" width="114" height="5" rx="2" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.5"/>' +
            // Headlights
            '<circle cx="10" cy="38" r="3" fill="rgba(255,255,255,0.4)" stroke="white" stroke-width="1.5"/>' +
            '<rect x="108" y="35" width="6" height="6" rx="1.5" fill="rgba(255,255,255,0.4)" stroke="white" stroke-width="1.5"/>' +
            // Stop sign arm
            '<rect x="0" y="24" width="5" height="8" rx="1" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1.2"/>' +
            // Wheels
            '<circle cx="28" cy="58" r="8" fill="rgba(0,0,0,0.3)" stroke="white" stroke-width="2.5"/>' +
            '<circle cx="28" cy="58" r="3" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>' +
            '<circle cx="88" cy="58" r="8" fill="rgba(0,0,0,0.3)" stroke="white" stroke-width="2.5"/>' +
            '<circle cx="88" cy="58" r="3" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>' +
            // Wheel wells
            '<path d="M18 50 Q18 55 22 58 Q18 61 18 66" stroke="white" stroke-width="1" fill="none"/>' +
            '<path d="M38 50 Q38 55 34 58 Q38 61 38 66" stroke="white" stroke-width="1" fill="none"/>' +
            '<path d="M78 50 Q78 55 82 58 Q78 61 78 66" stroke="white" stroke-width="1" fill="none"/>' +
            '<path d="M98 50 Q98 55 94 58 Q98 61 98 66" stroke="white" stroke-width="1" fill="none"/>' +
            '</svg>';

        // =====================================================
        //  APPLICATION CODE
        // =====================================================
        var STATES = ['arrived', 'late'];
        var busStates = {};
        var syncReady = false;
        var sb = null;

        function init() {
            createBusCards();
            initSync();
        }

        function createBusCards() {
            var grid = document.getElementById('busGrid');
            for (var i = 1; i <= BUS_COUNT; i++) {
                busStates[i] = 'arrived';
                var card = document.createElement('div');
                card.className = 'bus-card arrived';
                card.dataset.bus = i;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', 'Bus ' + i + ' - tap to change status');
                (function (num) {
                    card.onclick = function () { toggleBus(num); };
                })(i);
                card.innerHTML =
                    '<div class="bus-icon">' + BUS_SVG + '</div>' +
                    '<div class="bus-number">' + i + '</div>' +
                    '<div class="bus-status-text">ARRIVED</div>';
                grid.appendChild(card);
            }
        }

        function toggleBus(busNumber) {
            var current = busStates[busNumber];
            var next = (current === 'arrived') ? 'late' : 'arrived';
            busStates[busNumber] = next;
            updateBusCard(busNumber, true);

            if (syncReady && sb) {
                sb.from('bus_status')
                  .upsert({ bus_number: busNumber, status: next })
                  .then(function (res) {
                      if (res.error) console.error('Sync error:', res.error);
                  });
            }
        }

        function updateBusCard(busNumber, animate) {
            var card = document.querySelector('[data-bus="' + busNumber + '"]');
            if (!card) return;

            card.className = 'bus-card ' + busStates[busNumber];

            var label = card.querySelector('.bus-status-text');
            label.textContent = (busStates[busNumber] === 'late') ? 'LATE' : 'ARRIVED';

            if (animate) {
                card.classList.add('pop');
                setTimeout(function () { card.classList.remove('pop'); }, 260);
            }
        }

        function setConnectionStatus(state, message) {
            var dot  = document.getElementById('connectionDot');
            var text = document.getElementById('connectionText');
            dot.className = 'connection-dot' + (state === 'online' ? '' : state === 'offline' ? ' offline' : ' local');
            text.textContent = message;
        }

        function initSync() {
            if (!SUPABASE_URL || !SUPABASE_KEY) {
                document.getElementById('setupBanner').style.display = '';
                return;
            }

            try {
                sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                sb.from('bus_status')
                  .select('bus_number, status')
                  .then(function (res) {
                      if (res.error) {
                          console.error('Initial load error:', res.error);
                          setConnectionStatus('offline', 'Load Error');
                          return;
                      }
                      if (res.data) {
                          for (var k = 0; k < res.data.length; k++) {
                              var row = res.data[k];
                              if (busStates[row.bus_number] !== undefined) {
                                  // Map any legacy 'waiting' status to 'arrived'
                                  var status = (row.status === 'waiting') ? 'arrived' : row.status;
                                  busStates[row.bus_number] = status;
                                  updateBusCard(row.bus_number, false);
                              }
                          }
                      }
                  });

                sb.channel('bus-board')
                  .on(
                      'postgres_changes',
                      { event: '*', schema: 'public', table: 'bus_status' },
                      function (payload) {
                          var row = payload.new;
                          if (row && busStates[row.bus_number] !== undefined) {
                              var status = (row.status === 'waiting') ? 'arrived' : row.status;
                              if (busStates[row.bus_number] !== status) {
                                  busStates[row.bus_number] = status;
                                  updateBusCard(row.bus_number, true);
                              }
                          }
                      }
                  )
                  .subscribe(function (status) {
                      if (status === 'SUBSCRIBED') {
                          syncReady = true;
                          setConnectionStatus('online', 'Connected');
                      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                          setConnectionStatus('offline', 'Connection Error');
                      } else if (status === 'CLOSED') {
                          syncReady = false;
                          setConnectionStatus('offline', 'Disconnected');
                      }
                  });

            } catch (err) {
                console.error('Supabase init error:', err);
                document.getElementById('setupBanner').style.display = '';
            }
        }

        function resetAll() {
            if (!confirm('Reset all buses to Arrived?')) return;

            for (var i = 1; i <= BUS_COUNT; i++) {
                busStates[i] = 'arrived';
                updateBusCard(i, false);
            }

            if (syncReady && sb) {
                var updates = [];
                for (var j = 1; j <= BUS_COUNT; j++) {
                    updates.push({ bus_number: j, status: 'arrived' });
                }
                sb.from('bus_status')
                  .upsert(updates)
                  .then(function (res) {
                      if (res.error) console.error('Reset error:', res.error);
                  });
            }
        }

        document.addEventListener('keydown', function (e) {
            var n = parseInt(e.key, 10);
            if (n >= 1 && n <= 9) toggleBus(n);
            if (e.key === '0') toggleBus(10);
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
